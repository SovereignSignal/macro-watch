name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test
        run: |
          set +e
          npm test > test.log 2>&1
          status=$?
          cat test.log
          exit $status
      - name: Publish test log
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('test.log')
              ? fs.readFileSync('test.log', 'utf8')
              : 'test.log missing';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## test log\n\n```\n' + log.slice(0, 60000) + '\n```\n',
            });
      - run: npm run build
        env:
          # Fake URL: build-time prerender must succeed with no DB reachable
          # (queries are wrapped in safeQuery and render empty states).
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
